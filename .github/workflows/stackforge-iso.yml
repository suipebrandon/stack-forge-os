name: stackforge-mvp1-iso
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest testing/test_resolver.py -v
      - run: python -c "import json; json.load(open('stack-store/app-schema.json')); print('schema JSON OK')"

  build-iso:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (BIB needs ~10 GB)
        timeout-minutes: 8
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Show disk space
        run: df -h
      - name: Install podman
        timeout-minutes: 10
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y podman
          sudo podman info
      - name: Build bootc container
        timeout-minutes: 30
        working-directory: os/base-image
        run: |
          set -x
          sudo podman build -t stackforge-mvp1:ci -f Containerfile .
          sudo podman images
      - name: Build ISO with bootc-image-builder
        timeout-minutes: 60
        working-directory: os/base-image
        run: |
          set -x
          mkdir -p output config
          cat > config/config.toml <<'EOF'
          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "10GiB"
          EOF
          sudo podman images
          # NOTE: no storage mount — BIB reuses host store automatically (same root user).
          # Absolute paths required so BIB resolves mounts, not image name.
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/output":/output \
            -v "$PWD/config/config.toml":/config.toml:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso --config /config.toml --rootfs btrfs stackforge-mvp1:ci
          ls -lh output/ || echo "BIB produced no ISO - check log above"
      - uses: actions/upload-artifact@v5
        with:
          name: stackforge-mvp1-iso
          path: os/base-image/output/*.iso
